    <title>Legacy Cloud — Premium Minecraft Server Hosting</title>
    <meta name="description" content="Legacy Cloud delivers premium Minecraft server hosting on Intel and AMD Ryzen hardware. NVMe storage, DDoS protection, instant setup and human support." />
    <meta name="keywords" content="Minecraft hosting, Minecraft server hosting, Intel hosting, AMD Ryzen hosting, Infinity servers, game server hosting" />
    <!-- Apply the saved theme before first paint so there is no flash. Keep ids in sync with src/lib/themes.js -->
    <script>
      (function () {
        var d = document.documentElement;
        var themes = { 'legacy-dark': 'dark', 'legacy-light': 'light', cyber: 'dark', neu: 'light', bento: 'light', material: 'light', glass: 'dark' };
        var colors = { 'legacy-dark': '#050505', 'legacy-light': '#fafaf8', cyber: '#08020c', neu: '#f0eff4', bento: '#e2e2e6', material: '#eceefb', glass: '#05060d' };
        var t = 'legacy-dark', bg = 'animated';
        try {
          var app = JSON.parse(localStorage.getItem('swiftcloud_appearance') || '{}');
          if (app.default_theme && themes[app.default_theme]) t = app.default_theme;
          if (app.default_bg === 'animated' || app.default_bg === 'texture' || app.default_bg === 'plain') bg = app.default_bg;
          var st = localStorage.getItem('swiftcloud_theme'); if (st && themes[st]) t = st;
          var sb = localStorage.getItem('swiftcloud_bg'); if (sb === 'animated' || sb === 'texture' || sb === 'plain') bg = sb;
        } catch (e) {}
        d.setAttribute('data-theme', t); d.setAttribute('data-scheme', themes[t]); d.setAttribute('data-bg', bg);
        var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', colors[t]);
      })();
    </script>
